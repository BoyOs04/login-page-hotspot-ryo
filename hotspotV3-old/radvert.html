<html>
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="2; url=$(link-orig)">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">

<title>Advertisement</title>

<link rel="stylesheet" href="css/style.css">

<script>
var popup='';
function openOrig(){
 if(window.focus) popup.focus();
 location.href=unescape('$(link-orig-esc)');
}
function openAd(){
 location.href=unescape('$(link-redirect-esc)');
}
function openAdvert(){
 if(window.name!='hotspot_advert'){
  popup=open('$(link-redirect)','hotspot_advert','');
  setTimeout(openOrig,1000);
  return;
 }
 setTimeout(openAd,1000);
}
</script>

<!-- P5 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>

</head>

<body onload="openAdvert()">

<div id="bgCanvas-container"></div>

<div class="ie-fixMinHeight">
<div class="main">
<div class="wrap">

<h1>Advertisement</h1>
<p class="info">
Jika tidak terbuka otomatis, klik
<a href="$(link-redirect)" target="hotspot_advert">di sini</a>
</p>

</div>
</div>
</div>

<script src="js/bokeh.js"></script>

</body>
</html>
