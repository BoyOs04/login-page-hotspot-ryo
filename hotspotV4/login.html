<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Hotspot</title>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="js/config.js"></script>
</head>
<body>

    <div id="bgCanvas-container">
        <canvas id="bgCanvas"></canvas>
    </div>

    <div id="clock-box">
        <div id="clock-time">00:00:00</div>
        <div id="clock-date"> </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(typeof AppConfig === 'undefined') return;

            const popupUser = document.getElementById('popupUser');
            const popupPass = document.getElementById('popupPass');
            if(popupUser) popupUser.setAttribute('data-popup', 'Gunakan: ' + AppConfig.tamuUser);
            if(popupPass) popupPass.setAttribute('data-popup', 'Perhatikan : ' + AppConfig.tamuPass);

            const copyUserBtn = document.getElementById('copyUserBtn');
            const copyPassBtn = document.getElementById('copyPassBtn');
            if(copyUserBtn) {
                copyUserBtn.setAttribute('data-copy', AppConfig.tamuUser);
                copyUserBtn.setAttribute('title', "Klik untuk copy '" + AppConfig.tamuUser + "'");
            }
            if(copyPassBtn) {
                copyPassBtn.setAttribute('data-copy', AppConfig.tamuPass);
                copyPassBtn.setAttribute('title', "Klik untuk copy password");
            }
        });
    </script>

    $(if chap-id)
    <form name="sendin" action="$(link-login-only)" method="post" style="display:none">
        <input type="hidden" name="username" />
        <input type="hidden" name="password" />
        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />
    </form>

    <script src="/md5.js"></script>
    <script>
        function doLogin() {
            document.sendin.username.value = document.login.username.value;
            document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
            document.sendin.submit();
            return false;
        }
    </script>
    $(endif)

    <div class="ie-fixMinHeight">
        <main class="main login-card" id="loginCard">

            <div class="logo-container">

                <img src="img/favicon.png" alt="Logo" class="logo" onerror="this.style.display='none'">
                <div class="login-instructions">
                    <h1>Selamat Datang</h1>
                    <p>
                        Masukkan username dan password untuk terhubung ke Internet.
                    </p>
                </div>
            </div>

            <div class="wrap">
                <form name="login" action="$(link-login-only)" method="post" class="login-form" $(if chap-id) onSubmit="return doLogin()" $(endif)>
                    <input type="hidden" name="dst" value="$(link-orig)" />
                    <input type="hidden" name="popup" value="true" />

                    <div class="field-group">
                        <label class="field-label" for="usernameInput">Username</label>
                        <div class="input-container">
                            <input type="text" name="username" id="usernameInput" placeholder="Masukkan username" required autocomplete="username" inputmode="text">
                            <span class="field-line" aria-hidden="true"></span>
                        </div>
                    </div>

                    <div class="field-group">
                        <label class="field-label" for="passwordInput">Password</label>
                        <div class="input-container">
                            <input type="password" name="password" id="passwordInput" placeholder="Masukkan password" required autocomplete="current-password">
                            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Tampilkan password" aria-pressed="false">
                                <span class="eye-icon" aria-hidden="true"></span>
                            </button>
                            <span class="field-line" aria-hidden="true"></span>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="loginSubmit">
                        <span class="btn-label">HUBUNGKAN</span>
                    </button>
                </form>

                <div id="error-message" style="display:none;">$(error)</div>

                <div class="quick-access">
                    <span class="quick-caption">Quick access</span>
                    <button type="button" class="quick-link" onclick="quickLogin()">
                        <span>Gunakan Voucher</span>
                    </button>
                </div>

                $(if trial == 'yes')
                <div class="trial-access">
                    <span>Butuh akses cepat?</span>
                    <a href="$(link-login-only)?dst=$(link-orig-esc)&username=T-$(mac-esc)">Coba Gratis</a>
                </div>
                $(endif)
            </div>

            <div class="login-footer">
                <span>Powered by MikroTik RouterOS</span>
            </div>
        </main>
    </div>

    <div id="toast" class="toast"></div>
    <div id="custom-hover-popup" class="hover-popup"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>\n    <script src="js/script.js"></script>
    <script type="module" src="js/bokeh.js"></script>
</body>
</html>
