<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hotspot QR Login</title>
  <script src="js/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, wheat, #fffaf0, #f5deb3);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: linear-gradient(135deg, wheat, #fffaf0, #f5deb3);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      padding: 30px 20px;
      width: 100%;
      max-width: 400px;
      animation: fadeInUp 0.8s ease both;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      color: #5c4033;
      margin-bottom: 20px;
      font-size: 22px;
    }

    .carousel { display: flex; transition: transform 0.3s ease; }

    .qr-card {
      flex: 0 0 100%;
      padding: 20px;
      text-align: center;
    }

    .qr-card .qr-label {
      font-size: 18px;
      font-weight: bold;
      color: #8b4513;
      margin-bottom: 15px;
    }

    .qrcode a {
      display: inline-block;
      border-radius: 10px;
      overflow: hidden;
    }

    .qrcode img {
      width: 170px;
      height: 170px;
      display: block;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>QR Login Hotspot</h1>
    <div class="carousel" id="carousel">
      <div class="qr-card">
        <div class="qr-label">1. Tamu</div>
        <div class="qrcode">
          <a id="login1" href="#">
            <div id="qr1"></div>
          </a>
        </div>
      </div>

      <div class="qr-card">
        <div class="qr-label">2. Game</div>
        <div class="qrcode">
          <a id="login2" href="#">
            <div id="qr2"></div>
          </a>
        </div>
      </div>

      <div class="qr-card">
        <div class="qr-label">3. Juan</div>
        <div class="qrcode">
          <a id="login3" href="#">
            <div id="qr3"></div>
          </a>
        </div>
      </div>

      <div class="qr-card">
        <div class="qr-label">4. Andrew</div>
        <div class="qrcode">
          <a id="login4" href="#">
            <div id="qr4"></div>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const loginBase = "$(link-login-only)";

    const credentials = [
      { id: "1", user: "tamu", pass: "!guest" },
      { id: "2", user: "game", pass: "game" },
      { id: "3", user: "juan", pass: "juan1234" },
      { id: "4", user: "andrew", pass: "andrew1234" }
    ];

    function makeLoginUrl(user, pass) {
      const separator = loginBase.includes("?") ? "&" : "?";
      return loginBase +
        separator +
        "username=" + encodeURIComponent(user) +
        "&password=" + encodeURIComponent(pass);
    }

    credentials.forEach(account => {
      const url = makeLoginUrl(account.user, account.pass);
      document.getElementById("login" + account.id).href = url;

      new QRCode(document.getElementById("qr" + account.id), {
        text: url,
        width: 210,
        height: 210
      });
    });

    let currentCard = 0;
    const carousel = document.getElementById('carousel');
    const totalCards = carousel.children.length;

    function updateCarousel() {
      carousel.style.transform = `translateX(-${currentCard * 100}%)`;
    }

    let startX = 0;
    carousel.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
    });

    carousel.addEventListener('touchend', (e) => {
      const endX = e.changedTouches[0].clientX;
      if (startX - endX > 50 && currentCard < totalCards - 1) {
        currentCard++;
        updateCarousel();
      } else if (endX - startX > 50 && currentCard > 0) {
        currentCard--;
        updateCarousel();
      }
    });
  </script>
</body>
</html>
