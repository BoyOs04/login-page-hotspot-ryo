<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5deb3">
  <meta name="description" content="Hotspot V3 UI launcher and frontend preview.">
  <title>Hotspot V3 — UI Launcher</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="background" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <main class="page">
    <section class="hero glass">
      <div class="eyebrow">HOTSPOT V3</div>
      <h1>Portal UI Launcher</h1>
      <p class="subtitle">
        Pilih halaman HotSpot yang ingin kamu buka untuk melihat dan menguji desain frontend.
      </p>

      <div class="actions" id="pageActions">
        <a class="button button-primary" href="hotspotV3/login.html">
          <span>Login HotSpot</span>
          <span class="arrow">→</span>
        </a>

        <a class="button" href="hotspotV3/main.html">
          <span>Halaman Utama</span>
          <span class="arrow">→</span>
        </a>

        <a class="button" href="hotspotV3/status.html">
          <span>Status / Quota</span>
          <span class="arrow">→</span>
        </a>

        <a class="button" href="hotspotV3/qr.html">
          <span>QR Voucher</span>
          <span class="arrow">→</span>
        </a>

        <a class="button" href="hotspotV3/demo.html">
          <span>Frontend Demo</span>
          <span class="arrow">→</span>
        </a>
      </div>

      <div class="info">
        <span class="dot"></span>
        <span>GitHub Pages preview</span>
      </div>
    </section>

    <footer>
      <span>login-page-hotspot-ryo</span>
      <span>•</span>
      <span>Frontend only</span>
    </footer>
  </main>

  <script src="js/index.js"></script>
  <script type="module" src="hotspotV3/js/bokeh.js"></script>
</body>
</html>
